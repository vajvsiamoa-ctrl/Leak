<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoHub</title>

    <meta name="1b141c62af203cace78d00f882636a7f905ebad5" content="1b141c62af203cace78d00f882636a7f905ebad5" />

    <link rel="preconnect" href="https://luluvido.com">
    <link rel="dns-prefetch" href="https://luluvido.com">
    <link rel="preconnect" href="https://abacus.jasoncameron.dev">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0b0d; color: #fff; font-family: Arial, Helvetica, sans-serif; }
        header {
            height: 64px; background: #151518; border-bottom: 1px solid #29292d;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 22px; position: sticky; top: 0; z-index: 10;
        }
        .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
        .logo span { color: #ff3b5c; }
        .stats { display: flex; align-items: center; gap: 16px; color: #aaa; font-size: 13px; white-space: nowrap; }
        main { width: 100%; max-width: 1050px; margin: 0 auto; padding: 24px 15px 50px; }
        .section-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
        #videos { display: flex; flex-direction: column; gap: 22px; }
        .video-card {
            background: #151518; border: 1px solid #29292d; border-radius: 12px;
            overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.35);
        }
        .video-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; }
        iframe { width: 100%; height: 100%; border: 0; display: block; }
        .video-info { padding: 15px 17px; }
        .video-meta { color: #888; font-size: 13px; }
        .pagination { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 30px; }
        .pagination button {
            min-width: 40px; height: 40px; padding: 0 14px; background: #151518; color: #fff;
            border: 1px solid #29292d; border-radius: 8px; font-size: 14px; cursor: pointer;
        }
        .pagination button:hover:not(:disabled) { border-color: #ff3b5c; }
        .pagination button.active { background: #ff3b5c; border-color: #ff3b5c; font-weight: 700; }
        .pagination button:disabled { opacity: .35; cursor: not-allowed; }
        footer { text-align: center; color: #666; font-size: 13px; padding: 25px 15px; border-top: 1px solid #222; }
        @media (max-width: 600px) {
            header { height: 56px; padding: 0 12px; }
            .logo { font-size: 19px; }
            .stats { font-size: 11px; gap: 10px; }
            main { padding: 18px 10px 35px; }
            .section-title { font-size: 18px; }
            #videos { gap: 16px; }
            .video-card { border-radius: 8px; }
            .video-info { padding: 12px; }
            .pagination button { min-width: 36px; height: 36px; padding: 0 10px; }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">Video<span>Hub</span></div>
        <div class="stats">
            <span id="visits"></span>
            <span id="plays"></span>
        </div>
    </header>

    <main>
        <div class="section-title">Latest Videos</div>
        <div id="videos"></div>
        <div class="pagination" id="pagination"></div>
    </main>

    <footer>© 2026 VideoHub</footer>

    <script>
        const PER_PAGE = 8;

        const NAMESPACE = "videohub-k7q2x9";
        const COUNTER_API = "https://abacus.jasoncameron.dev";

        const KEY_SITE = "site";
        const KEY_TOTAL_PLAYS = "total_plays";

        const EMBED_BASE = "https://luluvido.com/e/";

        const videoIds = [
            "34zax65gr889"
        ];

        const stats = {};
        const fmt = n => Number(n || 0).toLocaleString("en-US");

        async function counterRequest(action, key) {
            try {
                const res = await fetch(COUNTER_API + "/" + action + "/" + NAMESPACE + "/" + key);
                if (!res.ok) return 0;
                const data = await res.json();
                return Number(data.value) || 0;
            } catch (e) {
                return null;
            }
        }

        function updateViewsUI() {
            document.querySelectorAll("[data-views]").forEach(function (el) {
                const v = stats[el.dataset.views];
                el.textContent = "👁 " + (v !== undefined ? fmt(v) : "...") + " views";
            });
            if (stats[KEY_SITE] !== undefined) {
                document.getElementById("visits").textContent = "👥 " + fmt(stats[KEY_SITE]) + " visits";
            }
            if (stats[KEY_TOTAL_PLAYS] !== undefined) {
                document.getElementById("plays").textContent = "▶ " + fmt(stats[KEY_TOTAL_PLAYS]) + " plays";
            }
        }

        async function loadPageStats(ids) {
            await Promise.all(ids.map(async function (id) {
                if (stats[id] !== undefined) return;
                const v = await counterRequest("get", id);
                if (v !== null) stats[id] = v;
            }));
            updateViewsUI();
        }

        async function trackVisit() {
            let first = false;
            try {
                first = !sessionStorage.getItem("visited");
                if (first) sessionStorage.setItem("visited", "1");
            } catch (e) {}

            const results = await Promise.all([
                counterRequest(first ? "hit" : "get", KEY_SITE),
                counterRequest("get", KEY_TOTAL_PLAYS)
            ]);

            if (results[0] !== null) stats[KEY_SITE] = results[0];
            if (results[1] !== null) stats[KEY_TOTAL_PLAYS] = results[1];
            updateViewsUI();
        }

        async function trackPlay(id) {
            const key = "played_" + id;
            try {
                if (sessionStorage.getItem(key)) return;
                sessionStorage.setItem(key, "1");
            } catch (e) {}

            const results = await Promise.all([
                counterRequest("hit", id),
                counterRequest("hit", KEY_TOTAL_PLAYS)
            ]);

            if (results[0] !== null) stats[id] = results[0];
            if (results[1] !== null) stats[KEY_TOTAL_PLAYS] = results[1];
            updateViewsUI();
        }

        let lastFocusedId = null;

        function checkIframeFocus() {
            const el = document.activeElement;
            if (el && el.tagName === "IFRAME" && el.dataset.id) {
                if (el.dataset.id !== lastFocusedId) {
                    lastFocusedId = el.dataset.id;
                    trackPlay(el.dataset.id);
                }
            } else {
                lastFocusedId = null;
            }
        }

        window.addEventListener("blur", function () {
            setTimeout(checkIframeFocus, 0);
        });
        setInterval(checkIframeFocus, 400);

        const totalPages = Math.ceil(videoIds.length / PER_PAGE);
        const container = document.getElementById("videos");
        const pagination = document.getElementById("pagination");

        function getPageFromUrl() {
            const p = parseInt(new URLSearchParams(location.search).get("page"), 10);
            return p >= 1 && p <= totalPages ? p : 1;
        }

        function renderVideos(page) {
            container.innerHTML = "";
            lastFocusedId = null;
            const start = (page - 1) * PER_PAGE;
            const pageIds = videoIds.slice(start, start + PER_PAGE);

            pageIds.forEach(function (id) {
                const card = document.createElement("div");
                card.className = "video-card";
                card.innerHTML =
                    '<div class="video-wrapper">' +
                        '<iframe data-id="' + id + '" src="' + EMBED_BASE + id + '" ' +
                        'scrolling="no" loading="lazy" allow="autoplay; fullscreen; picture-in-picture" ' +
                        'allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe>' +
                    '</div>' +
                    '<div class="video-info">' +
                        '<div class="video-meta"><span data-views="' + id + '">👁 ' +
                        (stats[id] !== undefined ? fmt(stats[id]) : "...") + ' views</span></div>' +
                    '</div>';
                container.appendChild(card);
            });

            loadPageStats(pageIds);
        }

        function renderPagination(page) {
            pagination.innerHTML = "";
            if (totalPages <= 1) return;

            function makeBtn(label, target, opts) {
                opts = opts || {};
                const b = document.createElement("button");
                b.textContent = label;
                if (opts.active) b.classList.add("active");
                if (opts.disabled) b.disabled = true;
                b.onclick = function () { goToPage(target); };
                pagination.appendChild(b);
            }

            makeBtn("« Prev", page - 1, { disabled: page === 1 });
            for (let p = 1; p <= totalPages; p++) {
                makeBtn(p, p, { active: p === page });
            }
            makeBtn("Next »", page + 1, { disabled: page === totalPages });
        }

        function goToPage(page) {
            try { history.pushState({}, "", "?page=" + page); } catch (e) {}
            showPage(page);
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function showPage(page) {
            renderVideos(page);
            renderPagination(page);
        }

        window.addEventListener("popstate", function () { showPage(getPageFromUrl()); });

        showPage(getPageFromUrl());
        trackVisit();
    </script>

</body>
</html>
