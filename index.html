<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leak 🔥</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:20px;background:#15151d;border-bottom:1px solid #292932}
h1{margin:0;font-size:28px}
main{max-width:1400px;margin:auto;padding:8px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.video-card{border:1px solid #30303b;border-radius:10px;overflow:hidden;background:#17171f}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.play-btn{position:absolute;inset:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:0;background:linear-gradient(135deg,#232336,#12121a);color:#fff;cursor:pointer;font-size:14px}
.play-btn:hover{background:linear-gradient(135deg,#2c2c45,#16161f)}
.play-icon{width:clamp(44px,12vw,80px);height:clamp(44px,12vw,80px);border-radius:50%;background:#5757e8;display:flex;align-items:center;justify-content:center}
.play-icon::after{content:"";margin-left:6px;border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent #fff}
.player{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.title{padding:8px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pagination{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:24px 0}
.pagination button{border:1px solid #393945;border-radius:6px;background:#1b1b25;color:#fff;padding:10px 14px;cursor:pointer}
.pagination button.active{background:#5757e8}
.pagination button:disabled{opacity:.35;cursor:default}
.dots{opacity:.5;padding:0 4px}
@media(min-width:700px){.gallery{gap:16px}main{padding:15px}}
</style>
</head>
<body>
<header><h1>Leak 🔥</h1></header>

<main>
  <div class="gallery" id="gallery"></div>
  <nav class="pagination" id="pagination" aria-label="Pages"></nav>
</main>

<script>
/* To add a video: add a new line below.
   { id: "VIDEO_ID", title: "Optional title" }
   (VIDEO_ID is the last part of https://vidara.to/e/XXXX) */
const VIDEOS = [
  { id: "NhbzG2NqQ6TPG" },
  { id: "b1m9pXFLktF4v" },
  { id: "N5jC5ThnWNSPP" },
  { id: "QthIyWY33ljjV" },
  { id: "PpuwxN2wlFujS" },
  { id: "KcbFAZ1fCGz6B" },
  { id: "zX6u9nxpl1ZRI" },
  { id: "mKlfkTTv7LOkm" },
  { id: "6FWercj1TZKlv" },
  { id: "ag2LfewnVMOFV" },
  { id: "7Jg2YegPiIws0" },
  { id: "6RRxgYtxENR2O" },
  { id: "MVNeK5A4VqY8t" },
  { id: "gy5M5AsZQEsNf" },
  { id: "5fiEkVCis1XWX" },
  { id: "p7P01plDoaWo3" },
  { id: "6VV5DuodKw01G" },
  { id: "qC3I6bMG9btlf" },
  { id: "1BcvDW6mTRPT7" },
  { id: "k5ffAkLMVutJP" },
  { id: "CpSbOCyjBso0c" },
  { id: "NWKnKvJDeFpC0" },
  { id: "f2HfACB09RoDk" },
  { id: "vZso9pE3FGah8" },
  { id: "zarOXxW8rxfgj" },
  { id: "668JaTRjVVzGW" },
  { id: "NvbI4uQkRh4Gx" },
  { id: "nDzqUkTB3qZo8" },
  { id: "XtHG5CXrGMGra" },
  { id: "G5tIVsatAmKyF" },
  { id: "Nl7G8vcAU0l4A" },
  { id: "gVOhulthj41tZ" },
  { id: "uuBVNoHVdU7W4" },
  { id: "MgYTenCiPdcQ1" },
  { id: "cDRPrwfbCj5ud" },
  { id: "acNZZrjK2YIbd" }
];

const perPage = 6; // videos per page
const videos = VIDEOS.filter(function(v, i, arr) {
  return v.id && arr.findIndex(function(x){ return x.id === v.id; }) === i;
});
const totalPages = Math.max(1, Math.ceil(videos.length / perPage));
let currentPage = 1;

const gallery = document.getElementById("gallery");
const pagination = document.getElementById("pagination");

function goTo(page) {
  currentPage = Math.min(Math.max(page, 1), totalPages);
  renderGallery();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function makeButton(label, onClick, disabled) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = label;
  b.disabled = !!disabled;
  b.addEventListener("click", onClick);
  return b;
}

function pageList() {
  const pages = [];
  for (let p = 1; p <= totalPages; p++) {
    if (p === 1 || p === totalPages || Math.abs(p - currentPage) <= 1) pages.push(p);
    else if (pages[pages.length - 1] !== "…") pages.push("…");
  }
  return pages;
}

function playVideo(box, video, label) {
  const frame = document.createElement("iframe");
  frame.className = "player";
  frame.src = "https://vidara.to/e/" + encodeURIComponent(video.id);
  frame.title = label;
  frame.allow = "autoplay; fullscreen; picture-in-picture";
  frame.referrerPolicy = "no-referrer-when-downgrade";
  frame.setAttribute("allowfullscreen", "");
  box.innerHTML = "";
  box.appendChild(frame);
}

function renderGallery() {
  gallery.innerHTML = "";
  pagination.innerHTML = "";

  const start = (currentPage - 1) * perPage;
  videos.slice(start, start + perPage).forEach(function(video, index) {
    const number = start + index + 1;
    const label = video.title || ("Video " + number);

    const card = document.createElement("div");
    card.className = "video-card";

    const box = document.createElement("div");
    box.className = "video-box";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "play-btn";
    btn.setAttribute("aria-label", "Play " + label);

    const icon = document.createElement("span");
    icon.className = "play-icon";
    btn.appendChild(icon);

    btn.addEventListener("click", function() { playVideo(box, video, label); });
    box.appendChild(btn);

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = label;

    card.appendChild(box);
    card.appendChild(title);
    gallery.appendChild(card);
  });

  if (totalPages === 1) return;

  pagination.appendChild(makeButton("Previous", function(){ goTo(currentPage - 1); }, currentPage === 1));

  pageList().forEach(function(p) {
    if (p === "…") {
      const d = document.createElement("span");
      d.className = "dots";
      d.textContent = "…";
      pagination.appendChild(d);
      return;
    }
    const b = makeButton(p, function(){ goTo(p); });
    if (p === currentPage) {
      b.classList.add("active");
      b.setAttribute("aria-current", "page");
    }
    pagination.appendChild(b);
  });

  pagination.appendChild(makeButton("Next", function(){ goTo(currentPage + 1); }, currentPage === totalPages));
}

renderGallery();
</script>
</body>
</html>
