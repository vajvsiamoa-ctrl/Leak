<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Website Verification -->
  <meta name="1b141c62af203cace78d00f882636a7f905ebad5"
        content="1b141c62af203cace78d00f882636a7f905ebad5">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Watch videos online">

  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 23px;
      font-weight: 700;
      color: #222;
      text-decoration: none;
    }

    .upload-button {
      padding: 10px 17px;
      border: 0;
      border-radius: 5px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      width: min(100% - 28px, 900px);
      margin: 28px auto;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      border-radius: 5px;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111;
    }

    .ad-panel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      background: #111;
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 18px;
      text-align: center;
    }

    .ad-panel.active {
      display: flex;
    }

    .ad-label {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 12px;
    }

    .ad-panel video {
      width: 100%;
      max-height: 75%;
    }

    .ad-message {
      line-height: 1.6;
      color: #ddd;
    }

    .banner {
      min-height: 90px;
      margin: 18px 0;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      border: 1px solid #eee;
      text-align: center;
      overflow: hidden;
    }

    .banner-label {
      color: #999;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .description {
      padding: 12px 0;
      font-size: 14px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      color: #777;
      border-top: 1px solid #eee;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .header {
        height: 58px;
        padding: 0 12px;
      }

      .logo {
        font-size: 19px;
      }

      .container {
        width: calc(100% - 20px);
        margin-top: 18px;
      }

      .banner {
        min-height: 70px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a class="logo" href="./">Video</a>

    <button class="upload-button" id="uploadButton" type="button">
      Upload
    </button>
  </header>

  <main class="container">

    <!-- Main Video Player -->
    <div class="video-box">

      <video
        id="mainVideo"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
      >
        Your browser does not support HTML5 video.
      </video>

      <!-- Pre-roll Advertisement -->
      <div class="ad-panel" id="adPanel">

        <div class="ad-label">ADVERTISEMENT</div>

        <video
          id="adVideo"
          playsinline
          preload="none"
        ></video>

        <div class="ad-message" id="adMessage">
          Advertisement
        </div>

      </div>

    </div>

    <!-- Banner Advertisement 1 -->
    <div class="banner" id="bannerOne">
      <div>
        <div class="banner-label">ADVERTISEMENT</div>
        <div id="bannerOneContent">Banner advertisement</div>
      </div>
    </div>

    <section class="description">
      <strong id="videoTitle">Watch Video</strong>
      <p>Enjoy watching videos online.</p>
    </section>

    <!-- Banner Advertisement 2 -->
    <div class="banner" id="bannerTwo">
      <div>
        <div class="banner-label">ADVERTISEMENT</div>
        <div id="bannerTwoContent">Banner advertisement</div>
      </div>
    </div>

  </main>

  <footer class="footer">
    Video Website
  </footer>

  <script>
    /*
     * WEBSITE CONFIGURATION
     */

    const CONFIG = {
      MAIN_VIDEO_URL: "https://files.catbox.moe/kc1e1o.mp4",

      VIDEO_TITLE: "Watch Video",

      // Enable only after configuring a real compatible ad.
      ENABLE_PREROLL_AD: false,

      // Optional MP4 ad URL for testing.
      // A real ad network may require a VAST integration.
      AD_VIDEO_URL: "",

      ENABLE_BANNER_ONE: true,
      ENABLE_BANNER_TWO: true,

      // Add your approved banner snippets here.
      BANNER_ONE_HTML: "",
      BANNER_TWO_HTML: ""
    };

    const mainVideo = document.getElementById("mainVideo");
    const adVideo = document.getElementById("adVideo");
    const adPanel = document.getElementById("adPanel");
    const adMessage = document.getElementById("adMessage");

    let adFinished = false;
    let adInProgress = false;
    let adStarted = false;
    let mainVideoStarted = false;

    /*
     * INITIALIZE VIDEO
     */

    document.getElementById("videoTitle").textContent =
      CONFIG.VIDEO_TITLE;

    mainVideo.src = CONFIG.MAIN_VIDEO_URL;

    /*
     * BANNER CONFIGURATION
     */

    function setupBanner(elementId, enabled, html) {
      const element = document.getElementById(elementId);

      if (!enabled) {
        element.style.display = "none";
        return;
      }

      const content = element.querySelector("div:last-child");

      if (html.trim()) {
        content.innerHTML = html;
      }
    }

    setupBanner(
      "bannerOne",
      CONFIG.ENABLE_BANNER_ONE,
      CONFIG.BANNER_ONE_HTML
    );

    setupBanner(
      "bannerTwo",
      CONFIG.ENABLE_BANNER_TWO,
      CONFIG.BANNER_TWO_HTML
    );

    /*
     * PLAY MAIN VIDEO
     */

    function playMainVideo() {
      adInProgress = false;
      adFinished = true;

      adPanel.classList.remove("active");

      adVideo.pause();
      adVideo.removeAttribute("src");
      adVideo.load();

      mainVideoStarted = true;

      mainVideo.play().catch(() => {
        // The visitor can press Play manually.
      });
    }

    /*
     * BASIC PRE-ROLL AD
     */

    function startAd() {
      if (
        !CONFIG.ENABLE_PREROLL_AD ||
        !CONFIG.AD_VIDEO_URL ||
        adStarted
      ) {
        playMainVideo();
        return;
      }

      adStarted = true;
      adInProgress = true;
      adFinished = false;

      mainVideo.pause();
      adPanel.classList.add("active");

      adMessage.textContent = "Advertisement playing...";

      adVideo.src = CONFIG.AD_VIDEO_URL;
      adVideo.load();

      adVideo.play().catch(() => {
        // Continue to the main video if the ad fails.
        playMainVideo();
      });
    }

    mainVideo.addEventListener("play", () => {
      if (
        !mainVideoStarted &&
        !adFinished &&
        CONFIG.ENABLE_PREROLL_AD
      ) {
        mainVideo.pause();
        startAd();
      }
    });

    adVideo.addEventListener("ended", () => {
      if (adInProgress) {
        playMainVideo();
      }
    });

    adVideo.addEventListener("error", () => {
      if (adInProgress) {
        playMainVideo();
      }
    });

    /*
     * UPLOAD BUTTON
     */

    document.getElementById("uploadButton").addEventListener("click", () => {
      alert(
        "Video uploads require a separate hosting service. " +
        "GitHub Pages does not support server-side uploads."
      );
    });
  </script>

</body>
</html>
