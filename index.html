<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Player</title>
  <meta name="description" content="Watch videos online.">
  <meta name="theme-color" content="#ffffff">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 23px;
      font-weight: 700;
      color: #222;
      text-decoration: none;
    }

    .upload-button {
      padding: 10px 17px;
      border: 0;
      border-radius: 5px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .container {
      width: min(100% - 28px, 900px);
      margin: 28px auto;
    }

    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      overflow: hidden;
      border-radius: 5px;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111;
    }

    .ad-panel {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 5;
      background: #111;
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 18px;
      text-align: center;
    }

    .ad-panel.active {
      display: flex;
    }

    .ad-label {
      font-size: 12px;
      color: #ccc;
      margin-bottom: 12px;
    }

    .ad-panel video {
      width: 100%;
      max-height: 75%;
    }

    .ad-message {
      line-height: 1.6;
      color: #ddd;
    }

    .skip-button {
      margin-top: 14px;
      padding: 10px 16px;
      background: #fff;
      border: 0;
      border-radius: 4px;
      color: #111;
      cursor: pointer;
    }

    .banner {
      min-height: 90px;
      margin: 18px 0;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f7f7;
      border: 1px solid #eee;
      text-align: center;
      overflow: hidden;
    }

    .banner-label {
      color: #999;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .description {
      padding: 12px 0;
      font-size: 14px;
      line-height: 1.7;
    }

    .footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      color: #777;
      border-top: 1px solid #eee;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .header {
        height: 58px;
        padding: 0 12px;
      }

      .logo {
        font-size: 19px;
      }

      .container {
        width: calc(100% - 20px);
        margin-top: 18px;
      }

      .banner {
        min-height: 70px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a class="logo" href="./">Video</a>
    <button class="upload-button" id="uploadButton" type="button">
      Upload
    </button>
  </header>

  <main class="container">

    <!-- Main video player -->
    <div class="video-box">

      <video
        id="mainVideo"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
      >
        Your browser does not support HTML5 video.
      </video>

      <!-- Advertisement overlay -->
      <div class="ad-panel" id="adPanel">
        <div class="ad-label">ADVERTISEMENT</div>

        <video
          id="adVideo"
          playsinline
          preload="none"
        ></video>

        <div class="ad-message" id="adMessage">
          Advertisement
        </div>

        <button
          class="skip-button"
          id="skipAdButton"
          type="button"
          hidden
        >
          Skip Ad
        </button>
      </div>

    </div>

    <!-- Banner Ad 1 -->
    <div class="banner" id="bannerOne">
      <div>
        <div class="banner-label">ADVERTISEMENT</div>
        <div id="bannerOneContent">
          Banner advertisement
        </div>
      </div>
    </div>

    <section class="description">
      <strong id="videoTitle">Watch Video</strong>
      <p>Enjoy watching videos online.</p>
    </section>

    <!-- Banner Ad 2 -->
    <div class="banner" id="bannerTwo">
      <div>
        <div class="banner-label">ADVERTISEMENT</div>
        <div id="bannerTwoContent">
          Banner advertisement
        </div>
      </div>
    </div>

  </main>

  <footer class="footer">
    Video Website
  </footer>

  <script>
    /*
    ============================================
    WEBSITE CONFIGURATION
    ============================================
    */

    const CONFIG = {

      // Replace this with a working MP4 URL.
      MAIN_VIDEO_URL: "YOUR_MAIN_VIDEO_MP4_URL",

      // Video title.
      VIDEO_TITLE: "Watch Video",

      // Set true after adding a valid video ad URL.
      ENABLE_PREROLL_AD: false,

      // Direct MP4 video ad URL for basic testing only.
      // For real network ads, use a compatible VAST player.
      AD_VIDEO_URL: "",

      // Enable or disable banner areas.
      ENABLE_BANNER_ONE: true,
      ENABLE_BANNER_TWO: true,

      // Paste provider-approved banner HTML snippets here.
      // Only use code from your actual advertising dashboard.
      BANNER_ONE_HTML: "",
      BANNER_TWO_HTML: ""
    };


    /*
    ============================================
    ELEMENTS
    ============================================
    */

    const mainVideo = document.getElementById("mainVideo");
    const adVideo = document.getElementById("adVideo");
    const adPanel = document.getElementById("adPanel");
    const adMessage = document.getElementById("adMessage");
    const skipAdButton = document.getElementById("skipAdButton");

    let adFinished = false;
    let adInProgress = false;
    let adStarted = false;
    let mainVideoStarted = false;


    /*
    ============================================
    INITIALIZE VIDEO
    ============================================
    */

    document.getElementById("videoTitle").textContent =
      CONFIG.VIDEO_TITLE;

    if (
      CONFIG.MAIN_VIDEO_URL &&
      CONFIG.MAIN_VIDEO_URL !== "YOUR_MAIN_VIDEO_MP4_URL"
    ) {
      mainVideo.src = CONFIG.MAIN_VIDEO_URL;
    } else {
      mainVideo.removeAttribute("src");
      mainVideo.load();
    }


    /*
    ============================================
    BANNER CONFIGURATION
    ============================================
    */

    function setupBanner(elementId, enabled, html) {
      const element = document.getElementById(elementId);

      if (!enabled) {
        element.style.display = "none";
        return;
      }

      const content = element.querySelector("div:last-child");

      if (html.trim()) {
        // Provider-approved HTML supplied by the site owner.
        content.innerHTML = html;
      }
    }

    setupBanner(
      "bannerOne",
      CONFIG.ENABLE_BANNER_ONE,
      CONFIG.BANNER_ONE_HTML
    );

    setupBanner(
      "bannerTwo",
      CONFIG.ENABLE_BANNER_TWO,
      CONFIG.BANNER_TWO_HTML
    );


    /*
    ============================================
    PRE-ROLL ADVERTISEMENT
    ============================================
    */

    function hasMainVideo() {
      return Boolean(
        CONFIG.MAIN_VIDEO_URL &&
        CONFIG.MAIN_VIDEO_URL !== "YOUR_MAIN_VIDEO_MP4_URL"
      );
    }

    function playMainVideo() {
      if (!hasMainVideo()) {
        adMessage.textContent =
          "Please configure a valid main video MP4 URL.";
        adPanel.classList.add("active");
        return;
      }

      adInProgress = false;
      adFinished = true;
      adPanel.classList.remove("active");

      adVideo.pause();
      adVideo.removeAttribute("src");
      adVideo.load();

      mainVideoStarted = true;
      mainVideo.play().catch(() => {
        // The visitor can press the main play button manually.
      });
    }

    function startAd() {
      if (
        !CONFIG.ENABLE_PREROLL_AD ||
        !CONFIG.AD_VIDEO_URL ||
        adStarted
      ) {
        playMainVideo();
        return;
      }

      adStarted = true;
      adInProgress = true;
      adFinished = false;

      mainVideo.pause();
      adPanel.classList.add("active");

      adMessage.textContent = "Advertisement playing...";
      skipAdButton.hidden = true;

      adVideo.src = CONFIG.AD_VIDEO_URL;
      adVideo.load();

      adVideo.play().then(() => {
        // This is a basic MP4 ad, not a VAST ad integration.
      }).catch(() => {
        // Do not trap the visitor if the ad fails.
        playMainVideo();
      });
    }

    mainVideo.addEventListener("play", () => {
      if (
        !mainVideoStarted &&
        !adFinished &&
        CONFIG.ENABLE_PREROLL_AD
      ) {
        mainVideo.pause();
        startAd();
      }
    });

    adVideo.addEventListener("ended", () => {
      if (adInProgress) {
        playMainVideo();
      }
    });

    adVideo.addEventListener("error", () => {
      if (adInProgress) {
        playMainVideo();
      }
    });

    skipAdButton.addEventListener("click", () => {
      // Skip is intentionally not enabled by default.
      // Only implement it according to the ad provider's rules.
    });


    /*
    ============================================
    UPLOAD BUTTON
    ============================================
    */

    document.getElementById("uploadButton").addEventListener("click", () => {
      alert(
        "This static website does not have a server-side upload system. " +
        "Configure an approved hosting service to upload videos."
      );
    });

  </script>

</body>
</html>
